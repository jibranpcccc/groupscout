# ------------------------------------------------------------------
# Netlify configuration
# ------------------------------------------------------------------
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Production site URL is set in the Netlify UI (Site settings -> Environment
  # variables). It is used for canonical URLs, sitemap and robots.txt.
  # PUBLIC_SITE_URL = "https://your-domain.example"

# ------------------------------------------------------------------
# Security headers (conservative: functionality must not break)
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# ------------------------------------------------------------------
# Redirects
# ------------------------------------------------------------------
[[redirects]]
  from = "/communities/1/"
  to = "/communities/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
