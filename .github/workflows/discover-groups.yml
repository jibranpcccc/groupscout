name: Discover Communities

# Daily automated pipeline (non-peak UTC time) + manual trigger:
#   discover (Tavily/Brave/Gemini search) → link validation → gated
#   auto-approve → schema validation → commit → Netlify auto-deploy.
#
# Gated auto-publish: candidates publish ONLY when they pass all quality
# gates (production guard, non-dead link, no safety flags, classified,
# sourced, no scam indicators) — everything else stays pending for human
# review. Cap AUTO_APPROVE_MAX per run (default 30).
# Only real data changes are committed; secrets are never committed.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_SEARCH_ENABLED: true
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      # Budget math: ~25 queries/day ≈ 750 Tavily credits/month (free tier
      # is 1,000/mo). Keeps the daily cost at $0 with headroom.
      DISCOVERY_MAX_QUERIES: 25
      DISCOVERY_MAX_CANDIDATES: 120
      AUTO_PUBLISH_DISCOVERED: false
      VALIDATE_MAX_CHECKS: 45
      VALIDATE_DELAY_MS: 1200
      AUTO_APPROVE_MAX: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run discovery
        # A failing discovery (quota exhaustion, Gemini errors, network)
        # must not break the run — the workflow still validates + commits
        # whatever data changed.
        run: npm run discover
        continue-on-error: true

      - name: Validate new links
        # Independent link checks (official Discord API, Telegram previews)
        # so dead invites can never be auto-published.
        run: npm run validate-links
        continue-on-error: true

      - name: Gated auto-approve
        run: npm run auto-approve
        continue-on-error: true

      - name: Validate data
        run: npm run validate-data

      - name: Commit data changes (bot)
        run: |
          git config user.name "community-directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "data: publish discovered communities"
            git push
          fi
