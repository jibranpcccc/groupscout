name: Discover Communities

# Daily automated pipeline (non-peak UTC time) + manual trigger:
#   discover (Tavily/Brave/Gemini search) → link validation → schema
#   validation → commit → Netlify auto-deploy.
#
# OBSERVATION-PHASE MODE (2026-08-19+): this is a 7-day integrity /
# discovery-observation period. Discovery is PENDING-ONLY — the daily run
# discovers new communities and validates their links, but does NOT
# auto-publish. The `npm run auto-approve` step is intentionally disabled
# during this phase; discovered candidates stay in pending-groups.json for
# manual, human review. Re-enable only when the owner ends the observation
# period and explicitly wants gated auto-publish.
#
# The gated auto-approve command remains available for MANUAL use
# (`npm run auto-approve`) and is fully hardened, but the schedule never
# runs it on its own while in observation mode.
#
# Gated auto-publish (when re-enabled) requires ALL: production guard clean,
# linkStatus 'active', fresh lastCheckedAt, independent source, no safety
# flags, classified with specific exam/cert intent, published=false.
# Only real data changes are committed; secrets are never committed.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_SEARCH_ENABLED: false
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      # Budget math: ~25 queries/day. TAVILY_API_KEYS holds a 26-key pool
      # in round-robin (26,000 credits/month across keys) — the daily run
      # rotates through keys and fails over on 429, so quota never stops it.
      DISCOVERY_MAX_QUERIES: 25
      DISCOVERY_MAX_CANDIDATES: 120
      AUTO_PUBLISH_DISCOVERED: false
      VALIDATE_MAX_CHECKS: 45
      VALIDATE_DELAY_MS: 1200
      AUTO_APPROVE_MAX: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run discovery
        # A failing discovery (quota exhaustion, Gemini errors, network)
        # must not break the run — the workflow still validates + commits
        # whatever data changed.
        run: npm run discover
        continue-on-error: true

      - name: Validate new links
        # Independent link checks (official Discord API, Telegram previews)
        # so dead invites are flagged. Observation phase: no auto-publish.
        run: npm run validate-links

      - name: Hold non-active pending candidates
        # Observation-phase audit item #4: the normal pending queue must
        # contain ONLY linkStatus==='active' candidates with explicit exam/cert
        # focus. Non-active links (unknown/dead/removed/reported) and generic
        # study/accountability communities with no exam/cert focus are moved to
        # held-groups.json — APPENDED (never overwritten), preserving the full
        # record plus a heldReason. Discovery behaviour/taxonomy/publishing
        # are unchanged; this only re-partitions pending.
        run: npm run hold-non-active

      # NOTE (observation phase): the gated auto-approve step is deliberately
      # absent from the schedule. Discovery is pending-only. To manually
      # approve held candidates, run `npm run auto-approve` locally.
      # - name: Gated auto-approve
      #   run: npm run auto-approve

      - name: Validate data
        run: npm run validate-data

      - name: Commit data changes (bot)
        run: |
          git config user.name "community-directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "data: publish discovered communities"
            git push
          fi
